<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="image-content">
        <img src="assets/image.jpg" id="image">
        <div id="logo">
            <img src="assets/odin-lined.png" id="image-logo">
            <p>ODIN</p>
        </div>
    </div>
    <div id="sign-in">
        <div id="info">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
            <p>You <em>know</em> you want to</p>
        </div>
        <form action="" method="post">
            <fieldset>
                <p id="form-title">Let's do this</p>
                <div>
                    <label for="fname">FIRST NAME</label>
                    <input type="text" id="fname" name="user_first_name" required>
                </div>
                <div>
                    <label for="lname">LAST NAME</label>
                    <input type="text" id="lname" name="user_last_name" required>
                </div>
                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="user_email" required>
                </div>
                <div>
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="user_phone_number" required>
                </div>
                <div>
                    <label for="pwd">PASSWORD</label>
                    <input type="password" id="pwd" name="user_password" required>
                </div>
                <div>
                    <label for="confirm-pwd">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-pwd" name="user_confirm_password" required>
                </div>
            </fieldset>
            <div id="bottom-content">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
